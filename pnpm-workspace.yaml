packages:
  - apps/*
  - packages/*
overrides:
  # Transformers.js does not use this native image path in the browser bundle;
  # keep its transitive install on the patched libvips line nonetheless.
  sharp: 0.35.3
allowBuilds:
  # The Observatory ships onnxruntime-web. These transitive server-side build
  # scripts are unnecessary for the static browser application.
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.5'
